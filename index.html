<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>ATHLOTES ALPHA V.54</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --accent: #FFFFFF; 
            --border: rgba(255, 255, 255, 0.15); 
            --pastel-red: #ff8a8a; 
            --pastel-green: #a8e6cf; 
            --glass: rgba(0, 0, 0, 0.5);
            --island-bg: rgba(0, 0, 0, 0.6);
            --bg-overlay: rgba(0,0,0,0);
            --gap: 15px;
            --pad: 15px;
        }
        
        /* THEMES */
        body.theme-matrix { --accent: #00FF00; --border: rgba(0, 255, 0, 0.2); --bg-overlay: rgba(0, 20, 0, 0.4); }
        body.theme-blood  { --accent: #FF4444; --border: rgba(255, 0, 0, 0.2); --bg-overlay: rgba(20, 0, 0, 0.4); }
        body.theme-ocean  { --accent: #00E5FF; --border: rgba(0, 229, 255, 0.2); --bg-overlay: rgba(0, 10, 20, 0.4); }
        body.theme-amber  { --accent: #FFB300; --border: rgba(255, 179, 0, 0.2); --bg-overlay: rgba(20, 15, 0, 0.4); }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body { 
            background: url('/static/background1.png') no-repeat center center fixed; 
            background-size: cover;
            color: var(--accent); 
            font-family: 'Quicksand', sans-serif; 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
            padding: var(--pad); 
            gap: var(--gap);
            transition: background 0.5s ease;
        }

        body::before { content: ""; position: absolute; inset: 0; background: var(--bg-overlay); pointer-events: none; z-index: 0; transition: 0.5s; }

        .btn-side, .task-btn { 
            width: 100%; 
            background: rgba(255,255,255,0.05); 
            border: 1px solid var(--border); 
            color: var(--accent); 
            padding: 10px; 
            cursor: pointer; 
            font-weight: 700; 
            font-family: inherit; 
            border-radius: 8px; 
            transition: all 0.2s ease;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-side:hover, .task-btn:hover { 
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
        }

        .task-btn { 
            width: auto; 
            padding: 5px 8px; 
            font-size: 0.75em; 
            white-space: nowrap;
        }

        /* UNL Button */
        .task-btn-unl { position: relative; }
        .task-btn-unl::after {
            content: '';
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 2px;
            background: var(--underline-color, #ffffff);
            border-radius: 2px;
            transition: background 0.2s;
        }

        /* UNL Color Picker Popover */
        #unlColorPopover {
            position: fixed;
            display: none;
            z-index: 3000;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            flex-direction: column;
            gap: 10px;
            min-width: 180px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #unlColorPopover.open { display: flex; }
        .unl-popover-title { font-size: 0.65em; letter-spacing: 2px; font-weight: 700; color: var(--accent); text-align: center; opacity: 0.7; }
        .unl-swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .unl-swatch { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.15s, border-color 0.15s; }
        .unl-swatch:hover { transform: scale(1.2); }
        .unl-swatch.active { border-color: #fff; }
        .unl-custom-row { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.7em; font-weight: 700; letter-spacing: 1px; color: var(--accent); opacity: 0.7; padding: 4px 6px; border-radius: 8px; border: 1px solid var(--border); transition: opacity 0.2s; }
        .unl-custom-row:hover { opacity: 1; }
        #unlCustomColorDot { width: 14px; height: 14px; border-radius: 50%; background: #ffffff; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.3); }
        .unl-apply-btn { background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: var(--accent); font-family: inherit; font-weight: 700; font-size: 0.7em; letter-spacing: 1px; border-radius: 8px; padding: 6px; cursor: pointer; transition: background 0.2s; text-transform: uppercase; }
        .unl-apply-btn:hover { background: rgba(255,255,255,0.15); }

        /* ─── SIDEBAR ──────────────────────────────────────────────────────── */
        #sidebar { 
            width: 280px;
            min-width: 280px;
            background: var(--island-bg); 
            backdrop-filter: blur(20px);
            border: 1px solid var(--border); 
            border-radius: 20px;
            display: flex; 
            flex-direction: column; 
            padding: 20px; 
            flex-shrink: 0; 
            z-index: 20;
            overflow: hidden;
            /* Smooth zen transition */
            transition: 
                width 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                min-width 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                padding 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.3s ease,
                border-color 0.4s ease,
                margin 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Zen state for sidebar */
        #sidebar.zen {
            width: 0 !important;
            min-width: 0 !important;
            padding: 0 !important;
            opacity: 0;
            border-color: transparent;
            margin-right: calc(-1 * var(--gap));
        }

        #logo-container { border: 2px solid var(--accent); padding: 10px; text-align: center; margin-bottom: 20px; border-radius: 10px; }
        #logo { font-size: 1.4em; font-weight: 700; letter-spacing: 5px; }

        #tree { flex-grow: 1; overflow-y: auto; scrollbar-width: none; margin-bottom: 10px; }
        .tree-node { margin-left: 10px; border-left: 1px solid rgba(255,255,255,0.1); }
        .tree-header { cursor: pointer; padding: 8px; font-weight: 700; display: flex; gap: 5px; align-items: center; border-radius: 8px; }
        .tree-header:hover { background: rgba(255,255,255,0.05); }
        .tree-file { cursor: pointer; padding: 5px 10px; font-size: 0.9em; display: flex; justify-content: space-between; border-radius: 5px; }
        .tree-file:hover { background: rgba(255,255,255,0.1); }

        /* ─── WORKSPACE ────────────────────────────────────────────────────── */
        #workspace { 
            flex-grow: 1; 
            display: flex; 
            position: relative; 
            gap: var(--gap); 
            z-index: 1;
            transition: gap 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .pane { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            border: 1px solid var(--border); 
            border-radius: 20px; 
            background: var(--glass); 
            backdrop-filter: blur(12px); 
            overflow: hidden; 
            min-width: 0; 
            transition: border 0.3s, box-shadow 0.3s, border-radius 0.4s; 
        }
        .pane.active { border: 1px solid var(--accent); box-shadow: 0 0 25px rgba(0,0,0,0.2); }

        /* Zen: pane goes full-screen flush with body edges */
        body.zen-mode .pane {
            border-radius: 20px;
        }

        #resizer { width: 6px; cursor: col-resize; z-index: 10; margin: 0 -10.5px; border-radius: 10px; }

        .taskbar { 
            height: 50px; 
            background: rgba(0,0,0,0.25); 
            border-bottom: 1px solid var(--border); 
            display: grid; 
            grid-template-columns: 1fr auto 1fr; 
            align-items: center; 
            padding: 0 10px; 
            gap: 5px;
        }
        .tb-left { display: flex; gap: 5px; overflow: hidden; }
        .tb-center { display: flex; justify-content: center; min-width: 50px; }
        .tb-right { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
        .note-title { font-size: 0.75em; opacity: 0.8; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; color: var(--accent); text-overflow: ellipsis; overflow: hidden; }

        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
        .dot-save { background: var(--pastel-green); box-shadow: 0 0 8px var(--pastel-green); }
        .dot-del { background: var(--pastel-red); cursor: pointer; border: none; transition: 0.2s; }
        .dot-del:hover { transform: scale(1.2); }
        .dot-del:disabled { background: rgba(255,138,138,0.25); cursor: not-allowed; transform: none !important; }

        .editor { flex-grow: 1; padding: 25px; overflow-y: auto; font-size: 1.1em; color: var(--accent); line-height: 1.6; background: transparent; }
        .editor ul { margin-left: 40px; margin-top: 10px; margin-bottom: 10px; }
        .word-count { font-size: 0.7em; opacity: 0.5; padding: 10px 25px; background: rgba(0,0,0,0.1); border-top: 1px solid var(--border); }

        /* ─── MODALS ───────────────────────────────────────────────────────── */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(10px); }
        .modal { background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(25px); border: 2px dashed var(--accent); padding: 30px; position: relative; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .modal-close { position: absolute; top: 18px; right: 18px; width: 14px; height: 14px; background: var(--pastel-red); border-radius: 50%; cursor: pointer; border: none; }
        .modal input { width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); color: #fff; padding: 15px 20px; margin: 25px 0; font-family: inherit; border-radius: 12px; font-size: 1.1em; transition: 0.3s; }
        .modal-list { max-height: 280px; overflow-y: auto; margin: 15px 0; display: flex; flex-direction: column; gap: 8px; scrollbar-width: none; }
        .modal-list-item { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 10px; border: 1px solid var(--border); font-size: 0.9em; transition: border-color 0.2s; }
        .modal-list-item:hover { border-color: rgba(255,255,255,0.3); }

        .trash-item-inner { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .trash-item-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: 0.85; }
        .trash-item-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .recovery-btn { width: auto !important; padding: 5px 10px !important; font-size: 0.75em !important; white-space: nowrap; background: rgba(255,255,255,0.08) !important; border: 1px solid var(--border) !important; color: var(--accent) !important; border-radius: 6px !important; cursor: pointer; font-family: inherit; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; transition: background 0.2s, border-color 0.2s !important; }
        .recovery-btn:hover { background: rgba(255,255,255,0.2) !important; border-color: var(--accent) !important; }
        .recovery-btn.del { color: var(--pastel-red) !important; }
        .recovery-btn.del:hover { background: rgba(255,100,100,0.15) !important; border-color: var(--pastel-red) !important; }
        
        .ctx-menu { position: fixed; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); border: 1px solid var(--border); display: none; z-index: 2000; min-width: 160px; border-radius: 12px; overflow: hidden; }
        .ctx-item { padding: 12px 15px; cursor: pointer; font-size: 0.8em; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .ctx-item:hover { background: var(--accent); color: #000; }
        
        .version-tag { font-size: 0.6em; opacity: 0.4; text-align: center; margin-bottom: 8px; letter-spacing: 2px; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        /* ─── THEME SELECTOR ───────────────────────────────────────────────── */
        #themeWrapper { position: relative; margin-bottom: 10px; }
        #themeBtn { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--accent); padding: 10px; cursor: pointer; font-weight: 700; font-family: inherit; border-radius: 8px; transition: all 0.2s ease; text-align: center; display: flex; align-items: center; justify-content: space-between; text-transform: uppercase; letter-spacing: 1px; font-size: 1em; }
        #themeBtn:hover { background: rgba(255,255,255,0.1); border-color: var(--accent); }
        #themeBtn .tb-arrow { font-size: 0.6em; opacity: 0.5; transition: transform 0.2s; }
        #themeBtn.open .tb-arrow { transform: rotate(180deg); }

        #themeDropdown { position: absolute; bottom: calc(100% + 8px); left: 0; right: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: none; flex-direction: column; z-index: 500; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); }
        #themeDropdown.open { display: flex; }

        .theme-option { padding: 11px 14px; cursor: pointer; font-size: 0.8em; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 10px; transition: background 0.15s; }
        .theme-option:last-child { border-bottom: none; }
        .theme-option:hover { background: rgba(255,255,255,0.08); }
        .theme-option.active { background: rgba(255,255,255,0.06); }
        .theme-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

        .theme-option-custom { flex-direction: column; align-items: flex-start; gap: 8px; }
        .theme-option-custom-top { display: flex; align-items: center; gap: 10px; width: 100%; }
        .custom-color-preview { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.3); transition: background 0.2s; }
        .custom-swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; width: 100%; padding: 0 24px; }
        .custom-swatch { width: 100%; aspect-ratio: 1; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.15s, border-color 0.15s; }
        .custom-swatch:hover { transform: scale(1.15); }
        .custom-swatch.active { border-color: #fff; }
        .custom-picker-row { display: flex; align-items: center; gap: 6px; padding: 4px 24px 6px; width: 100%; cursor: pointer; font-size: 0.7em; letter-spacing: 1px; opacity: 0.6; transition: opacity 0.2s; }
        .custom-picker-row:hover { opacity: 1; }

        #globalColorPicker { position: absolute; visibility: hidden; width: 0; height: 0; }
        #unlHiddenPicker { position: absolute; visibility: hidden; width: 0; height: 0; }
    </style>
</head>
<body onclick="closeAllMenus()">

<input type="color" id="globalColorPicker" oninput="updateCustomColor(this.value)">
<input type="color" id="unlHiddenPicker" oninput="onUnlCustomPick(this.value)">

<!-- UNL Color Picker Popover -->
<div id="unlColorPopover" onclick="event.stopPropagation()">
    <div class="unl-popover-title">UNDERLINE COLOR</div>
    <div class="unl-swatches" id="unlSwatches"></div>
    <div class="unl-custom-row" onclick="document.getElementById('unlHiddenPicker').click()">
        <div id="unlCustomColorDot"></div>
        <span>CUSTOM COLOR</span>
    </div>
    <button class="unl-apply-btn" onclick="applyUnderline()">APPLY UNDERLINE</button>
</div>

<div id="sidebar">
    <div id="logo-container"><div id="logo">ATHLOTES</div></div>
    <button class="btn-side" style="margin-bottom: 10px;" onclick="openModal('createModal')">ADD ENTRY</button>
    <button class="btn-side" style="margin-bottom: 15px;" onclick="toggleSplit()">SPLIT VIEW</button>
    
    <div id="tree"></div>
    
    <div style="margin-top: auto; padding-top: 20px;">
        <div class="version-tag">ALPHA V.54</div>
        <div id="themeWrapper" onclick="event.stopPropagation()">
            <button id="themeBtn" onclick="toggleThemeDropdown()">
                <span id="themeBtnLabel">THEME: GLASS DARK</span>
                <span class="tb-arrow">▼</span>
            </button>
            <div id="themeDropdown">
                <div class="theme-option active" data-theme="" onclick="selectTheme(this)">
                    <div class="theme-dot" style="background:#ffffff"></div>GLASS DARK
                </div>
                <div class="theme-option" data-theme="theme-matrix" onclick="selectTheme(this)">
                    <div class="theme-dot" style="background:#00FF00"></div>MATRIX
                </div>
                <div class="theme-option" data-theme="theme-blood" onclick="selectTheme(this)">
                    <div class="theme-dot" style="background:#FF4444"></div>BLOOD
                </div>
                <div class="theme-option" data-theme="theme-ocean" onclick="selectTheme(this)">
                    <div class="theme-dot" style="background:#00E5FF"></div>OCEAN
                </div>
                <div class="theme-option" data-theme="theme-amber" onclick="selectTheme(this)">
                    <div class="theme-dot" style="background:#FFB300"></div>AMBER
                </div>
                <div class="theme-option theme-option-custom" data-theme="theme-custom" onclick="">
                    <div class="theme-option-custom-top" onclick="selectTheme(this.closest('.theme-option'))">
                        <div class="custom-color-preview" id="customColorPreview" style="background:#ffffff"></div>
                        CUSTOM
                    </div>
                    <div class="custom-swatches" id="customSwatches"></div>
                    <div class="custom-picker-row" onclick="document.getElementById('globalColorPicker').click()">
                        <span>+ PICK COLOR</span>
                    </div>
                </div>
            </div>
        </div>
        <button class="btn-side" style="font-size: 0.8em;" onclick="openTrash()">RECOVERY HUB</button>
    </div>
</div>

<div id="workspace">
    <div class="pane active" id="pane-left" onmousedown="setFocus('left')">
        <div class="taskbar">
            <div class="tb-left">
                <button class="task-btn" id="zen-btn-left" onclick="toggleZen()">ZEN</button>
                <button class="task-btn" onclick="applyFormat('bold')">BIG</button>
                <button class="task-btn task-btn-unl" id="unl-btn-left" onclick="toggleUnlPopover(event, 'left')">UNL</button>
                <button class="task-btn" onclick="applyFormat('removeFormat')">RES</button>
            </div>
            <div class="tb-center"><span id="title-left" class="note-title">NO FILE</span></div>
            <div class="tb-right">
                <div id="save-left" class="dot dot-save" style="display:none"></div>
                <button class="dot dot-del" id="close-left" onclick="closePane('left')"></button>
            </div>
        </div>
        <div id="editor-left" class="editor" contenteditable="true" oninput="handleInput('left')" onkeydown="handleMarkdown(event, 'left')"></div>
        <div class="word-count" id="count-left">WORDS: 0 | ALPHA</div>
    </div>
    
    <div id="resizer"></div>
    
    <div class="pane" id="pane-right" style="display:none" onmousedown="setFocus('right')">
        <div class="taskbar">
            <div class="tb-left">
                <button class="task-btn" id="zen-btn-right" onclick="toggleZen()">ZEN</button>
                <button class="task-btn" onclick="applyFormat('bold')">BIG</button>
                <button class="task-btn task-btn-unl" id="unl-btn-right" onclick="toggleUnlPopover(event, 'right')">UNL</button>
                <button class="task-btn" onclick="applyFormat('removeFormat')">RES</button>
            </div>
            <div class="tb-center"><span id="title-right" class="note-title">NO FILE</span></div>
            <div class="tb-right">
                <div id="save-right" class="dot dot-save" style="display:none"></div>
                <button class="dot dot-del" id="close-right" onclick="closePane('right')"></button>
            </div>
        </div>
        <div id="editor-right" class="editor" contenteditable="true" oninput="handleInput('right')" onkeydown="handleMarkdown(event, 'right')"></div>
        <div class="word-count" id="count-right">WORDS: 0 | BETA</div>
    </div>
</div>

<!-- Modals -->
<div id="createModal" class="modal-overlay" onclick="closeModal('createModal')">
    <div class="modal" style="width: 400px;" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeModal('createModal')"></button>
        <div style="font-weight:700; text-align: center; letter-spacing: 2px;">[ NEW ENTRY ]</div>
        <input type="text" id="newName" placeholder="Name or path" autocomplete="off">
        <div style="display:flex; gap:15px;">
            <button class="btn-side" onclick="createItem('file')">FILE</button>
            <button class="btn-side" onclick="createItem('dir')">FOLDER</button>
        </div>
    </div>
</div>

<div id="moveModal" class="modal-overlay" onclick="closeModal('moveModal')">
    <div class="modal" style="width: 400px;" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeModal('moveModal')"></button>
        <div style="font-weight:700; text-align: center; letter-spacing: 2px;">[ MOVE TO ]</div>
        <div class="modal-list" id="folderList"></div>
    </div>
</div>

<div id="trashModal" class="modal-overlay" onclick="closeModal('trashModal')">
    <div class="modal" style="width:450px" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeModal('trashModal')"></button>
        <div style="font-weight:700; margin-bottom:20px; text-align: center;">[ 🗑 RECOVERY HUB ]</div>
        <div id="trashList" class="modal-list"></div>
    </div>
</div>

<div id="renameModal" class="modal-overlay" onclick="closeModal('renameModal')">
    <div class="modal" style="width: 400px;" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeModal('renameModal')"></button>
        <div style="font-weight:700; text-align: center; letter-spacing: 2px;">[ RENAME ]</div>
        <input type="text" id="renameInput" placeholder="New name" autocomplete="off">
        <button class="btn-side" onclick="executeRename()">SAVE CHANGES</button>
    </div>
</div>

<div id="ctxMenu" class="ctx-menu">
    <div class="ctx-item" onclick="openRenameModal()">RENAME</div>
    <div class="ctx-item" onclick="openMoveModal()">MOVE TO</div>
    <div class="ctx-item" style="color:var(--pastel-red)" onclick="deleteItem()">DELETE</div>
</div>

<script>
    let currentPaths = { left: null, right: null }, activeSide = 'left', selectedPath = null;
    let isZenMode = false;

    const CUSTOM_SWATCHES = [
        '#ffffff','#ff8a8a','#a8e6cf','#FFB300','#00E5FF',
        '#c9b1ff','#ffcf77','#ff6eb4','#7fffb2','#b0d4ff'
    ];
    let activeTheme = '';
    let currentCustomColor = '#ffffff';

    function buildCustomSwatches() {
        const container = document.getElementById('customSwatches');
        container.innerHTML = '';
        CUSTOM_SWATCHES.forEach(color => {
            const s = document.createElement('div');
            s.className = 'custom-swatch' + (color === currentCustomColor ? ' active' : '');
            s.style.background = color;
            s.title = color;
            s.onclick = (e) => { e.stopPropagation(); currentCustomColor = color; applyCustomTheme(color); };
            container.appendChild(s);
        });
    }

    function toggleThemeDropdown() {
        const btn = document.getElementById('themeBtn');
        const dd = document.getElementById('themeDropdown');
        const isOpen = dd.classList.contains('open');
        dd.classList.toggle('open', !isOpen);
        btn.classList.toggle('open', !isOpen);
        if (!isOpen) buildCustomSwatches();
    }

    function selectTheme(el) {
        const theme = el.dataset.theme;
        document.body.className = isZenMode ? 'zen-mode' : '';
        if (theme && theme !== 'theme-custom') {
            document.body.classList.add(theme);
            document.documentElement.style.removeProperty('--accent');
            document.documentElement.style.removeProperty('--border');
            document.documentElement.style.removeProperty('--bg-overlay');
        } else if (theme === 'theme-custom') {
            applyCustomTheme(currentCustomColor);
        } else {
            document.documentElement.style.removeProperty('--accent');
            document.documentElement.style.removeProperty('--border');
            document.documentElement.style.removeProperty('--bg-overlay');
        }
        activeTheme = theme;
        const label = el.querySelector('.theme-option-custom-top') ? 'CUSTOM' : el.textContent.trim();
        document.getElementById('themeBtnLabel').textContent = 'THEME: ' + label;
        document.querySelectorAll('.theme-option').forEach(o => o.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('themeDropdown').classList.remove('open');
        document.getElementById('themeBtn').classList.remove('open');
    }

    function applyCustomTheme(color) {
        const wasZen = document.body.classList.contains('zen-mode');
        document.body.className = wasZen ? 'zen-mode' : '';
        document.documentElement.style.setProperty('--accent', color);
        document.documentElement.style.setProperty('--border', hexToRgba(color, 0.2));
        document.documentElement.style.setProperty('--bg-overlay', hexToRgba(color, 0.04));
        document.getElementById('customColorPreview').style.background = color;
        currentCustomColor = color;
        document.querySelectorAll('.custom-swatch').forEach(s => {
            s.classList.toggle('active', s.style.background === color || s.style.background === hexToRgb(color));
        });
    }

    function hexToRgba(hex, alpha) {
        const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
        return `rgba(${r},${g},${b},${alpha})`;
    }
    function hexToRgb(hex) {
        const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
        return `rgb(${r}, ${g}, ${b})`;
    }

    function updateCustomColor(val) {
        currentCustomColor = val;
        applyCustomTheme(val);
        const customOption = document.querySelector('[data-theme="theme-custom"]');
        document.querySelectorAll('.theme-option').forEach(o => o.classList.remove('active'));
        customOption.classList.add('active');
        document.getElementById('themeBtnLabel').textContent = 'THEME: CUSTOM';
        activeTheme = 'theme-custom';
    }

    const UNL_SWATCHES = [
        '#ffffff','#ff8a8a','#a8e6cf','#FFB300','#00E5FF',
        '#c9b1ff','#ffcf77','#ff6eb4','#7fffb2','#b0d4ff'
    ];
    let unlColor = '#ffffff';
    let unlPopoverSide = 'left';
    let savedSelection = null;

    function buildUnlSwatches() {
        const container = document.getElementById('unlSwatches');
        container.innerHTML = '';
        UNL_SWATCHES.forEach(color => {
            const s = document.createElement('div');
            s.className = 'unl-swatch' + (color === unlColor ? ' active' : '');
            s.style.background = color;
            s.title = color;
            s.onclick = () => selectUnlColor(color);
            container.appendChild(s);
        });
    }

    function selectUnlColor(color) {
        unlColor = color;
        document.getElementById('unlCustomColorDot').style.background = color;
        document.querySelectorAll('.unl-swatch').forEach(s => {
            s.classList.toggle('active', s.style.background === hexToRgb(color) || s.style.background === color);
        });
        document.documentElement.style.setProperty('--underline-color', color);
    }

    function onUnlCustomPick(val) {
        unlColor = val;
        document.getElementById('unlCustomColorDot').style.background = val;
        document.documentElement.style.setProperty('--underline-color', val);
        document.querySelectorAll('.unl-swatch').forEach(s => s.classList.remove('active'));
    }

    function toggleUnlPopover(e, side) {
        e.stopPropagation();
        unlPopoverSide = side;
        savedSelection = saveSelection();
        const popover = document.getElementById('unlColorPopover');
        const isOpen = popover.classList.contains('open');
        popover.classList.toggle('open', !isOpen);
        if (!isOpen) {
            buildUnlSwatches();
            const btn = e.currentTarget;
            const rect = btn.getBoundingClientRect();
            popover.style.left = rect.left + 'px';
            popover.style.top = (rect.bottom + 8) + 'px';
        }
    }

    function applyUnderline() {
        if (savedSelection) restoreSelection(savedSelection);
        const sel = window.getSelection();
        if (sel && sel.rangeCount && !sel.getRangeAt(0).collapsed) {
            const span = document.createElement('span');
            span.style.textDecoration = 'underline';
            span.style.textDecorationColor = unlColor;
            try { sel.getRangeAt(0).surroundContents(span); } catch(e) {}
            handleInput(unlPopoverSide);
        }
        document.getElementById('unlColorPopover').classList.remove('open');
    }

    function saveSelection() {
        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return null;
        return sel.getRangeAt(0).cloneRange();
    }
    function restoreSelection(range) {
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
    }
    
    async function loadTree() {
        const res = await fetch('/api/tree');
        const tree = await res.json();
        const container = document.getElementById('tree');
        container.innerHTML = '';
        tree.children.forEach(child => renderNode(child, container));
    }

    function renderNode(node, container) {
        const div = document.createElement('div');
        div.className = 'tree-node';
        if (node.type === 'file') {
            div.innerHTML = `<div class="tree-file" onclick="openNote('${node.path}', activeSide)" oncontextmenu="showCtx(event, '${node.path}')">
                <span>${node.name}</span><span style="opacity:0.3;font-size:0.7em">${node.date || ''}</span>
            </div>`;
        } else {
            div.innerHTML = `<div class="tree-header" onclick="toggleFolder(this)" oncontextmenu="showCtx(event, '${node.path}')">
                <span class="arrow">></span><span>${node.name}</span>
            </div><div class="tree-children" style="display:none"></div>`;
            node.children.forEach(c => renderNode(c, div.querySelector('.tree-children')));
        }
        container.appendChild(div);
    }

    function toggleFolder(el) {
        const children = el.nextElementSibling;
        const arrow = el.querySelector('.arrow');
        const isOpen = children.style.display === 'block';
        children.style.display = isOpen ? 'none' : 'block';
        arrow.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(90deg)';
    }

    async function openNote(path, side) {
        currentPaths[side] = path;
        const res = await fetch('/get_content', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({path})});
        const data = await res.json();
        document.getElementById(`editor-${side}`).innerHTML = data.content;
        document.getElementById(`title-${side}`).innerText = path.split('/').pop();
        document.getElementById(`pane-${side}`).style.display = 'flex';
        updateWordCount(side); setFocus(side); checkLayout();
    }

    async function openTrash() {
        const res = await fetch('/api/trash_list');
        const items = await res.json();
        const list = document.getElementById('trashList');
        list.innerHTML = items.length === 0
            ? `<div style="text-align:center;opacity:0.4;font-size:0.85em;padding:20px;">NOTHING IN TRASH</div>`
            : items.map(i => `
            <div class="modal-list-item">
                <div class="trash-item-inner">
                    <span class="trash-item-name">${i}</span>
                    <div class="trash-item-actions">
                        <button onclick="trashAction('${i}', 'restore')" class="recovery-btn">RES</button>
                        <button onclick="trashAction('${i}', 'purge')" class="recovery-btn del">DEL</button>
                    </div>
                </div>
            </div>`).join('');
        openModal('trashModal');
    }

    async function trashAction(name, action) { 
        await fetch('/trash_op', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action, name})}); 
        openTrash(); loadTree(); 
    }

    async function openMoveModal() {
        const res = await fetch('/api/tree');
        const tree = await res.json();
        const folders = [];
        function extractFolders(node) {
            if (node.type === 'dir') {
                folders.push(node.path === "." ? "ROOT" : node.path);
                node.children.forEach(extractFolders);
            }
        }
        extractFolders(tree);
        const list = document.getElementById('folderList');
        list.innerHTML = folders.map(f => `<div class="modal-list-item" style="cursor:pointer;" onclick="executeMove('${f}')">${f}</div>`).join('');
        openModal('moveModal');
    }

    async function executeMove(targetFolder) {
        if(!selectedPath) return;
        const dest = targetFolder === 'ROOT' ? "" : targetFolder;
        await fetch('/move', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({src: selectedPath, dest_folder: dest})});
        closeModal('moveModal'); loadTree();
    }

    function openRenameModal() {
        if(!selectedPath) return;
        document.getElementById('renameInput').value = selectedPath.split('/').pop();
        openModal('renameModal');
    }

    async function executeRename() {
        const newName = document.getElementById('renameInput').value;
        if(!newName || !selectedPath) return;
        await fetch('/rename', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({old: selectedPath, new: newName})});
        closeModal('renameModal'); loadTree();
    }

    async function deleteItem() {
        if(!selectedPath) return;
        await fetch('/trash_op', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'to_trash', name:selectedPath})});
        loadTree(); closeAllMenus();
    }

    function handleInput(side) {
        if (!currentPaths[side]) return;
        document.getElementById(`save-${side}`).style.display = 'inline-block';
        updateWordCount(side);
        clearTimeout(window['t'+side]);
        window['t'+side] = setTimeout(async () => {
            await fetch('/save', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({path: currentPaths[side], content: document.getElementById(`editor-${side}`).innerHTML})});
            document.getElementById(`save-${side}`).style.display = 'none';
        }, 800);
    }

    function updateWordCount(side) {
        const text = document.getElementById(`editor-${side}`).innerText.trim();
        const count = text ? text.split(/\s+/).length : 0;
        document.getElementById(`count-${side}`).innerText = `WORDS: ${count} | ${side === 'left' ? 'ALPHA' : 'BETA'}`;
    }

    function toggleZen() {
        isZenMode = !isZenMode;
        const sidebar = document.getElementById('sidebar');
        const body = document.body;

        if (isZenMode) {
            body.classList.add('zen-mode');
            sidebar.classList.add('zen');
        } else {
            body.classList.remove('zen-mode');
            sidebar.classList.remove('zen');
        }

        updateCloseButtons();
    }

    function updateCloseButtons() {
        const leftVisible  = document.getElementById('pane-left').style.display  !== 'none';
        const rightVisible = document.getElementById('pane-right').style.display !== 'none';
        const visibleCount = [leftVisible, rightVisible].filter(Boolean).length;

        ['left', 'right'].forEach(side => {
            const btn = document.getElementById(`close-${side}`);
            const paneVisible = document.getElementById(`pane-${side}`).style.display !== 'none';
            btn.disabled = isZenMode && paneVisible && visibleCount === 1;
        });
    }

    function toggleSplit() {
        const r = document.getElementById('pane-right');
        r.style.display = r.style.display === 'none' ? 'flex' : 'none';
        checkLayout();
        updateCloseButtons();
    }

    function checkLayout() {
        const pL = document.getElementById('pane-left'), pR = document.getElementById('pane-right'), res = document.getElementById('resizer');
        res.style.display = (pL.style.display !== 'none' && pR.style.display !== 'none') ? 'block' : 'none';
    }

    function closePane(s) {
        const btn = document.getElementById(`close-${s}`);
        if (btn.disabled) return;
        document.getElementById(`pane-${s}`).style.display = 'none';
        checkLayout();
        updateCloseButtons();
    }

    function applyFormat(cmd) {
        document.execCommand(cmd, false, null);
        handleInput(activeSide);
    }

    function handleMarkdown(e, side) {
        if (e.key === ' ') {
            const sel = window.getSelection(); const range = sel.getRangeAt(0);
            const text = range.startContainer.textContent.slice(0, range.startOffset);
            if (text === '#') { e.preventDefault(); document.execCommand('delete', false, null); document.execCommand('formatBlock', false, 'H1'); }
            else if (text === '-') { e.preventDefault(); document.execCommand('delete', false, null); document.execCommand('insertUnorderedList', false, null); }
        }
    }

    let isResizing = false;
    document.getElementById('resizer').addEventListener('mousedown', () => isResizing = true);
    window.addEventListener('mousemove', (e) => { 
        if (!isResizing) return; 
        let rect = document.getElementById('workspace').getBoundingClientRect(); 
        let per = ((e.clientX - rect.left) / rect.width) * 100; 
        if (per > 15 && per < 85) document.getElementById('pane-left').style.flex = `0 0 ${per}%`; 
    });
    window.addEventListener('mouseup', () => isResizing = false);

    async function createItem(type) {
        const name = document.getElementById('newName').value; if (!name) return;
        await fetch('/create', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, type})});
        loadTree(); closeModal('createModal');
    }

    function showCtx(e, path) { e.preventDefault(); e.stopPropagation(); selectedPath = path; const m = document.getElementById('ctxMenu'); m.style.display = 'block'; m.style.left = e.pageX+'px'; m.style.top = e.pageY+'px'; }
    function setFocus(s) { activeSide = s; document.querySelectorAll('.pane').forEach(p => p.classList.remove('active')); document.getElementById(`pane-${s}`).classList.add('active'); }
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function closeAllMenus() { 
        document.getElementById('ctxMenu').style.display = 'none'; 
        document.getElementById('unlColorPopover').classList.remove('open');
        document.getElementById('themeDropdown').classList.remove('open');
        document.getElementById('themeBtn').classList.remove('open');
    }

    document.documentElement.style.setProperty('--underline-color', unlColor);
    buildCustomSwatches();
    window.onload = loadTree;
</script>
</body>
</html>
